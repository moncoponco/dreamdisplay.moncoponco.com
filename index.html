<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>dream display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="nav">
    <a href="https://moncoponco.com">moncoponco</a>
  </header>

  <!-- the keychain — held by the hand in the middle of the screen;
       moving the mouse swings the objects (main.js) -->
  <div id="keychain">

    <img class="hand" src="images/web/hand.png" alt="a hand with henna moons holding the keychain">
    <div class="ring"></div>

    <!-- 1 · the face charm, on the left -->
    <div class="charm charm-face" data-base="-26" data-coup="1" data-k="0.006" data-lag="0.10" data-swing="14" data-freq="0.0008" data-phase="0">
      <div class="link"></div>
      <img class="face-card" src="images/web/face-tears.png" alt="drawing of a round face with teal earrings">
    </div>

    <!-- 2 · the invitation paper, front and center -->
    <div class="charm charm-paper" data-base="0" data-coup="1" data-k="0.03" data-lag="0.05" data-tilt="0.3">
      <div class="link"></div>
      <div class="paper">
        <div class="hole"></div>
        <p class="when split-words">
          Thursday<br>
          August 20th<br>
          Williamsburg
        </p>
        <p class="about split-words">
          For the past 8 years my friend and I have exchanged voice notes
          with our dreams. I started painting hers (abstractly) last year, now at 7 pieces. Next week I will invade Alter Space for a night and show them to you!
        </p>
        <p class="signoff">MONCOPONCO</p>
      </div>
    </div>

    <!-- 3 · the painting, on the right -->
    <div class="charm charm-painting" data-base="24" data-coup="1.2" data-k="0.012" data-lag="0.08" data-swing="14" data-freq="0.0008" data-phase="3.14" data-drag="0.965">
      <div class="link"></div>
      <img class="painting-card" src="images/web/painting-orange.jpg" alt="abstract painting in oranges and dark reds">
    </div>

  </div>

  <!-- the RSVP url is set by main.js (kept encoded so the public repo isn't searchable for it) -->
  <a class="rsvp-float" href="#">RSVP</a>

  <script src="main.js?v=2"></script>
</body>
</html>
